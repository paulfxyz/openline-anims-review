<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Openline — Choose your animations</title>
<meta name="description" content="Walk every animated section on the Openline site and pick one option per board." />
<link rel="stylesheet" href="css/choice.css" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0B0F'/%3E%3Ccircle cx='16' cy='16' r='7' fill='none' stroke='%2316A34A' stroke-width='4'/%3E%3C/svg%3E" />
</head>
<body>

<header class="ch-head-bar">
  <a class="ch-brand" href="index.html">
    <svg viewBox="0 0 32 32" aria-label="Openline">
      <path d="M16 5a11 11 0 1 0 11 11" fill="none" stroke="currentColor" stroke-width="4.5" stroke-linecap="round"/>
      <circle cx="25.5" cy="6.5" r="4" fill="#FF5314"/>
    </svg>
    <span>
      <span class="ch-b1">Choose your animations</span>
      <span class="ch-b2">One pick per section, then copy the result</span>
    </span>
  </a>

  <div class="ch-prog">
    <div class="ch-track"><div class="ch-barfill" id="ch-bar"></div></div>
    <span class="ch-count" id="ch-count">—</span>
  </div>

  <a class="ch-back" href="index.html">All boards →</a>
</header>

<nav class="ch-rail" id="ch-rail" aria-label="Sections to decide"></nav>

<main class="ch-main" id="ch-main"></main>

<div class="ch-foot" id="ch-foot" hidden></div>

<!-- 1:1 viewer, filled by choice.js when the artwork on a card is clicked -->
<div class="ch-zoom" id="ch-zoom" hidden></div>

<!--
  boards.js owns the registry and renders the review overview as an import
  side effect. These four hosts are what it reaches for; keeping them here
  (empty and hidden) means /choice reads the exact same board list the
  review site does, with no forked copy to drift.
-->
<div id="overview" hidden></div>
<div id="boards" hidden></div>
<nav id="nav-pages" hidden></nav>
<nav id="nav-sections" hidden></nav>

<script type="module" src="js/choice.js"></script>
</body>
</html>
